name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publish
        run: dotnet publish hygeia.csproj -c Release -o publish

      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path publish\* -DestinationPath "hygeia-$version-portable.zip"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "/DPublishDir=publish" hygeia.iss

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          gh release create "${{ github.ref_name }}" --title "hygeia $version" --notes "hygeia $version`n`n- hygeia-$version-portable.zip: unzip and run hygeia.exe`n- hygeia-$version-setup.exe: choose the install folder and language" "hygeia-$version-portable.zip" "dist\hygeia-$version-setup.exe"
